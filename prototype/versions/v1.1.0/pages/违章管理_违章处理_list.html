<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>违章处理 · 企微H5 · v1.1.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f5f7fa; color: #0f172a;
    }
    .wecom-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40;
      background: rgba(255,255,255,0.96); border-bottom: 1px solid #e2e8f0;
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      padding: 12px 16px;
    }
    .wecom-content {
      padding: 68px 16px 24px; max-width: 480px; margin: 0 auto; box-sizing: border-box;
    }
    .btn { -webkit-transition: transform .15s; transition: transform .15s; }
    .btn:active { -webkit-transform: scale(.95); transform: scale(.95); }
    .item-card {
      background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
      box-shadow: 0 2px 8px rgba(15,23,42,.04); padding: 12px; margin-bottom: 10px;
    }
    .tag {
      display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px;
      background: #f8fafc; color: #475569; border: 1px solid #e2e8f0;
    }
    .tag.wait { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .hint { font-size: 11px; color: #94a3b8; line-height: 1.5; margin-bottom: 10px; }
  </style>
</head>
<body>
  <header class="wecom-header">
    <div style="display:flex;align-items:center;justify-content:space-between;max-width:480px;margin:0 auto;">
      <button type="button" class="btn" style="width:36px;height:36px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;"
              onclick="location.href='wecom_home.html'" aria-label="返回首页">
        <i class="fa-solid fa-angle-left"></i>
      </button>
      <div style="font-size:15px;font-weight:600;">违章处理</div>
      <div style="width:36px;"></div>
    </div>
  </header>

  <div class="wecom-content">
    <div class="hint">待处理的违章登记。处理完成后状态由平台回写。</div>
    <div class="item-card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">
        <div>
          <div style="font-size:14px;font-weight:600;">未佩戴安全帽</div>
          <div style="font-size:12px;color:#64748b;margin-top:4px;">违章人员：李某 · 处理责任人：王强</div>
        </div>
        <span class="tag wait">待处理</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;">
        <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px;">
          <div style="font-size:11px;color:#94a3b8;">违章地点</div>
          <div style="font-size:13px;font-weight:600;margin-top:4px;">生产一车间</div>
        </div>
        <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px;">
          <div style="font-size:11px;color:#94a3b8;">违章时间</div>
          <div style="font-size:13px;font-weight:600;margin-top:4px;">2026-07-06</div>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px;">
        <button type="button" class="btn" style="height:30px;padding:0 10px;border:1px solid #e2e8f0;border-radius:8px;background:#fff;font-size:12px;" onclick="toast('原型演示：查看')">查看</button>
        <button type="button" class="btn" style="height:30px;padding:0 10px;border:0;border-radius:8px;background:#0f172a;color:#fff;font-size:12px;" onclick="location.href='wecom_违章管理_违章处理_form.html'">处理</button>
      </div>
    </div>
  </div>

  <div id="toast" style="position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:rgba(15,23,42,.9);color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:90;"></div>
  <script>
    function toast(m) {
      var el = document.getElementById('toast');
      el.textContent = m;
      el.style.opacity = '1';
      setTimeout(function () { el.style.opacity = '0'; }, 1600);
    }
  </script>
</body>
</html>
