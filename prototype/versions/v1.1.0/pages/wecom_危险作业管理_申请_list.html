<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>危险作业申请 · 企微H5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #f5f7fa;
      color: #0f172a;
      margin: 0;
    }
    .wecom-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40;
      background: rgba(255,255,255,0.96);
      border-bottom: 1px solid #e2e8f0;
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
    }
    .wecom-content {
      padding: calc(var(--wecom-header-h, 56px) + 12px) 16px 96px;
      max-width: 480px;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .tab-row {
      display: -webkit-box;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-bottom: 12px;
      -webkit-box-align: center;
      align-items: center;
    }
    .tab-btn {
      -webkit-flex-shrink: 0;
      flex-shrink: 0;
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #e2e8f0;
      background: #fff;
      color: #334155;
    }
    .tab-btn.active {
      background: #0f172a;
      border-color: #0f172a;
      color: #fff;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(15,23,42,0.04);
    }
    .meta-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px;
    }
    .btn { -webkit-transition: transform 0.15s ease; transition: transform 0.15s ease; }
    .btn:active { -webkit-transform: scale(0.95); transform: scale(0.95); }
    .footer-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
      background: rgba(255,255,255,0.98);
      border-top: 1px solid #e2e8f0;
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
      max-width: 480px;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .footer-bar .btn {
      width: 100%;
      min-height: 44px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      background: #0f172a;
      color: #fff;
    }
    .ver-tag { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid;
    }
  </style>
</head>
<body>
  <header class="wecom-header" id="wecomHeader">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;max-width:480px;margin:0 auto;">
      <button type="button" class="btn" style="width:36px;height:36px;border-radius:10px;border:1px solid #e2e8f0;background:#fff;"
              onclick="navBack('wecom_home.html')" aria-label="返回">
        <i class="fa-solid fa-angle-left" style="color:#334155;"></i>
      </button>
      <div style="text-align:center;">
        <div style="font-size:15px;font-weight:650;">危险作业申请</div>
        <div class="ver-tag">v1.1.0 · 企微H5</div>
      </div>
      <div style="width:36px;"></div>
    </div>
  </header>

  <div class="wecom-content">
    <div class="tab-row hide-scrollbar" id="statusTabs">
      <button type="button" class="tab-btn active btn" data-status="all" onclick="setStatusFilter('all')">全部</button>
      <button type="button" class="tab-btn btn" data-status="pending" onclick="setStatusFilter('pending')">待审批</button>
      <button type="button" class="tab-btn btn" data-status="pass" onclick="setStatusFilter('pass')">已通过</button>
      <button type="button" class="tab-btn btn" data-status="draft" onclick="setStatusFilter('draft')">草稿</button>
      <div id="countHint" style="margin-left:auto;font-size:12px;color:#94a3b8;flex-shrink:0;">共 6 条</div>
    </div>
    <div id="listContainer"></div>
  </div>

  <div class="footer-bar">
    <button type="button" class="btn" onclick="navTo('wecom_危险作业管理_申请_form.html')">
      <i class="fa-solid fa-plus" style="margin-right:6px;"></i>新增申请
    </button>
  </div>

  <script src="permit-types.js"></script>
  <script>
    function toast(message) {
      var el = document.createElement('div');
      el.style.cssText = 'position:fixed;left:50%;bottom:96px;z-index:999;transform:translateX(-50%);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:500;color:#fff;background:rgba(15,23,42,0.9);box-shadow:0 8px 24px rgba(0,0,0,0.18);max-width:86%;';
      el.textContent = message;
      document.body.appendChild(el);
      setTimeout(function () { el.style.opacity = '0'; el.style.transition = 'opacity 250ms ease'; }, 1200);
      setTimeout(function () { el.remove(); }, 1700);
    }
    function navTo(page) { location.href = page; }
    function navBack(fallback) { if (fallback) location.href = fallback; }
    function syncHeaderH() {
      var h = document.getElementById('wecomHeader');
      if (h) document.documentElement.style.setProperty('--wecom-header-h', h.offsetHeight + 'px');
    }

    var LIST_DATA = [
      { id: 'WP-001', type: 'hot_work', name: '动火作业申请（焊接检修）', date: '2026-07-08', area: '生产一车间', status: 'pending' },
      { id: 'WP-002', type: 'high_altitude', name: '高处作业申请（设备检修）', date: '2026-07-09', area: '仓储区', status: 'pass' },
      { id: 'WP-003', type: 'lifting', name: '吊装作业申请（设备移位）', date: '2026-07-10', area: '码头区', status: 'draft' },
      { id: 'WP-004', type: 'confined_space', name: '有限空间作业申请', date: '2026-07-11', area: '污水处理站', status: 'pending' },
      { id: 'WP-005', type: 'earthwork', name: '动土作业申请（管道敷设）', date: '2026-07-12', area: '厂区东侧', status: 'pass' },
      { id: 'WP-006', type: 'temp_electricity', name: '临时用电作业申请', date: '2026-07-13', area: '维修车间', status: 'pending' }
    ];
    var currentFilter = 'all';

    function statusBadge(status) {
      var map = {
        draft: { bg: '#f1f5f9', color: '#475569', border: '#e2e8f0', label: '草稿' },
        pending: { bg: '#fffbeb', color: '#b45309', border: '#fde68a', label: '待审批' },
        pass: { bg: '#ecfdf5', color: '#047857', border: '#a7f3d0', label: '已通过' },
        reject: { bg: '#fff1f2', color: '#be123c', border: '#fecdd3', label: '已驳回' }
      };
      var s = map[status] || map.draft;
      return '<span class="badge" style="background:' + s.bg + ';color:' + s.color + ';border-color:' + s.border + ';">' + s.label + '</span>';
    }

    function setStatusFilter(status) {
      currentFilter = status;
      var tabs = document.querySelectorAll('#statusTabs .tab-btn');
      for (var i = 0; i < tabs.length; i++) {
        tabs[i].classList.toggle('active', tabs[i].getAttribute('data-status') === status);
      }
      renderList();
    }

    function renderList() {
      var data = LIST_DATA.filter(function (item) {
        return currentFilter === 'all' || item.status === currentFilter;
      });
      document.getElementById('countHint').textContent = '共 ' + data.length + ' 条';
      var html = data.map(function (item) {
        var cfg = PERMIT_TYPES[item.type];
        var actions = ''
          + '<button type="button" class="btn" style="padding:7px 12px;border-radius:10px;border:1px solid #e2e8f0;background:#fff;font-size:12px;font-weight:600;color:#334155;" '
          + 'onclick="navTo(\'wecom_危险作业管理_申请_detail.html?type=' + item.type + '\')">查看</button>'
          + '<button type="button" class="btn" style="padding:7px 12px;border-radius:10px;border:1px solid #e2e8f0;background:#fff;font-size:12px;font-weight:600;color:#334155;" '
          + 'onclick="navTo(\'wecom_危险作业管理_申请_form.html?type=' + item.type + '\')">编辑</button>';
        if (item.status === 'pass') {
          actions += '<button type="button" class="btn" style="padding:7px 12px;border-radius:10px;border:1px solid #bfdbfe;background:#eff6ff;font-size:12px;font-weight:600;color:#1d4ed8;" '
            + 'onclick="navTo(\'wecom_危险作业管理_作业票_preview.html?type=' + item.type + '\')">作业票</button>';
        }
        if (item.status === 'pending') {
          actions += '<button type="button" class="btn" style="padding:7px 12px;border-radius:10px;border:1px solid #fde68a;background:#fffbeb;font-size:12px;font-weight:600;color:#b45309;" '
            + 'onclick="toast(\'原型演示：已提交审批（平台办理）\')">发起审批</button>';
        }
        return '<div class="card">'
          + '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;">'
          + '<div style="min-width:0;">'
          + '<div style="font-size:14px;font-weight:650;color:#0f172a;">' + item.name + '</div>'
          + '<div style="font-size:12px;color:#64748b;margin-top:4px;">' + cfg.name + ' · ' + item.date + '</div>'
          + '</div>' + statusBadge(item.status) + '</div>'
          + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;font-size:12px;">'
          + '<div class="meta-box"><div style="color:#64748b;">申请编号</div><div style="margin-top:4px;font-weight:650;color:#1e293b;">' + item.id + '</div></div>'
          + '<div class="meta-box"><div style="color:#64748b;">作业区域</div><div style="margin-top:4px;font-weight:650;color:#1e293b;">' + item.area + '</div></div>'
          + '</div>'
          + '<div style="margin-top:12px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;">' + actions + '</div>'
          + '</div>';
      }).join('');
      document.getElementById('listContainer').innerHTML = html || '<div style="text-align:center;color:#94a3b8;font-size:13px;padding:40px 0;">暂无数据</div>';
    }

    document.addEventListener('DOMContentLoaded', function () {
      syncHeaderH();
      renderList();
    });
    window.addEventListener('resize', syncHeaderH);
  </script>
</body>
</html>
