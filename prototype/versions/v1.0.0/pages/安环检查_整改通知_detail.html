<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>流程审批 · 整改通知</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="mobile-layout.css">
  <style>
    .mobile-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40; padding-top: 3rem;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px); border-bottom: 1px solid #e2e8f0;
    }
    .mobile-content {
      padding-top: var(--mobile-header-h, 7rem); padding-bottom: 1.5rem;
      padding-left: 1rem; padding-right: 1rem;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .btn { transition: transform 0.15s ease; }
    .btn:active { transform: scale(0.97); }
    .sec-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 15px; font-weight: 650; color: #0f172a; margin-bottom: 12px;
    }
    .sec-title::before {
      content: ""; width: 3px; height: 14px; border-radius: 2px; background: #3b82f6;
    }
    .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
    .kv-item .lab { font-size: 12px; color: #64748b; margin-bottom: 4px; }
    .kv-item .val { font-size: 14px; color: #0f172a; font-weight: 550; line-height: 1.35; word-break: break-all; }
    .radio-row { display: flex; align-items: center; gap: 16px; pointer-events: none; }
    .radio-item { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #334155; }
    .radio-item input { accent-color: #3b82f6; width: 16px; height: 16px; }
    .hazard-row {
      border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px;
      background: #fff;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
  <header class="mobile-header px-4 pb-3">
    <div class="flex items-center justify-between">
      <button type="button" class="btn w-10 h-10 rounded-xl bg-white border border-slate-200"
              onclick="navBack('安环检查_整改通知_list.html')">
        <i class="fa-solid fa-angle-left text-slate-700"></i>
      </button>
      <div class="text-[15px] font-semibold text-slate-900">流程审批</div>
      <div class="w-10"></div>
    </div>
  </header>

  <main class="mobile-content space-y-3">
    <section class="rounded-2xl bg-white border border-slate-200 p-4">
      <div class="sec-title">检查信息</div>
      <div class="kv">
        <div class="kv-item"><div class="lab">检查编号</div><div class="val" id="checkNo">—</div></div>
        <div class="kv-item"><div class="lab">检查日期</div><div class="val" id="checkDate">—</div></div>
        <div class="kv-item"><div class="lab">检查类型</div><div class="val" id="checkType">—</div></div>
        <div class="kv-item"><div class="lab">被检查单位</div><div class="val" id="unit">—</div></div>
      </div>
    </section>

    <section class="rounded-2xl bg-white border border-slate-200 p-4">
      <div class="sec-title">检查结果</div>
      <div class="mb-4">
        <div class="radio-row">
          <label class="radio-item"><input type="radio" name="result" id="rNormal" disabled /> 正常</label>
          <label class="radio-item"><input type="radio" name="result" id="rAbnormal" disabled /> 异常</label>
        </div>
      </div>
      <div class="kv" id="abnormalMeta">
        <div class="kv-item"><div class="lab">整改责任人</div><div class="val" id="owner">—</div></div>
        <div class="kv-item"><div class="lab">整改截止日期</div><div class="val" id="deadline">—</div></div>
        <div class="kv-item" style="grid-column:1/-1"><div class="lab">风险等级</div><div class="val" id="riskLevel">—</div></div>
      </div>
    </section>

    <section class="rounded-2xl bg-white border border-slate-200 p-4">
      <div class="sec-title">隐患问题</div>
      <div class="space-y-3" id="hazardList"></div>
    </section>
  </main>

  <script>
function qs(sel, root) { return (root || document).querySelector(sel); }
function toast(message) {
  const el = document.createElement('div');
  el.className = 'fixed left-1/2 -translate-x-1/2 bottom-24 z-[999] px-4 py-2 rounded-2xl text-sm font-medium text-white bg-slate-900/90';
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 250ms ease'; }, 1200);
  setTimeout(() => el.remove(), 1700);
}
function navTo(page) { window.location.href = page; }
function navBack(fallback) {
  if (history.length > 1) history.back();
  else if (fallback) navTo(fallback);
}
function syncMobileLayout() {
  const header = document.querySelector('.mobile-header');
  if (header) document.documentElement.style.setProperty('--mobile-header-h', header.offsetHeight + 'px');
}
document.addEventListener('DOMContentLoaded', syncMobileLayout);
window.addEventListener('resize', syncMobileLayout);
  </script>
  <script>
const RECTIFY_RECORDS = {
  '1': {
    checkNo: '202610190071',
    checkDate: '2026-10-19',
    checkType: '周度检查计划',
    unit: '设备维保项目部',
    result: 'abnormal',
    owner: '翁庆洋',
    deadline: '2026-10-26',
    riskLevel: 'IV级(低风险)',
    status: 'pending',
    hazards: [
      {
        id: 'h1',
        status: '待整改',
        hazardType: '临时用电',
        isMajor: false,
        description: '4#泊位电缆线需套管或从走桥架，规范布线',
        requirement: '立即整改',
        problemPhotos: ['https://images.unsplash.com/photo-1581092160562-40aa08e78837?auto=format&fit=crop&w=400&h=300&q=80'],
        attachments: [],
        done: false
      },
      {
        id: 'h2',
        status: '待整改',
        hazardType: '围挡防护',
        isMajor: false,
        description: '1#泊位装船机新安装垫板涂刷油漆，移动脚手架搭设不规范',
        requirement: '立即整改',
        problemPhotos: ['https://images.unsplash.com/photo-1504328345606-18bbc8c9d7d1?auto=format&fit=crop&w=400&h=300&q=80'],
        attachments: [],
        done: false
      }
    ]
  },
  '2': {
    checkNo: '202610120045',
    checkDate: '2026-10-12',
    checkType: '日常巡检',
    unit: '码头作业区',
    result: 'abnormal',
    owner: '李明',
    deadline: '2026-10-18',
    riskLevel: 'III级(一般风险)',
    status: 'review',
    hazards: [
      {
        id: 'h3',
        status: '待复核',
        hazardType: '消防器材',
        isMajor: true,

    ]
  },
  '3': {
    checkNo: '202610050018',
    checkDate: '2026-10-05',
    checkType: '综合检查',
    unit: '生产一车间',
    result: 'abnormal',
    owner: '赵工',
    deadline: '2026-10-12',
    riskLevel: 'IV级(低风险)',
    status: 'done',
    hazards: [
      {
        id: 'h4',
        status: '已复核',
        hazardType: '安全标识',
        isMajor: false,
        description: '车间入口及作业区域缺少安全警示标识',
        requirement: '补齐标识牌',
        problemPhotos: [],
        attachments: [],
        done: true,
        rectifyNote: '已补齐 3 处标识。'
      }
    ]
  }
};

const id = new URLSearchParams(location.search).get('id') || '1';
const record = RECTIFY_RECORDS[id] || RECTIFY_RECORDS['1'];

qs('#checkNo').textContent = record.checkNo;
qs('#checkDate').textContent = record.checkDate;
qs('#checkType').textContent = record.checkType;
qs('#unit').textContent = record.unit;
qs('#rNormal').checked = record.result === 'normal';
qs('#rAbnormal').checked = record.result !== 'normal';
qs('#owner').textContent = record.owner;
qs('#deadline').textContent = record.deadline;
qs('#riskLevel').textContent = record.riskLevel;
qs('#abnormalMeta').style.display = record.result === 'normal' ? 'none' : '';

qs('#hazardList').innerHTML = record.hazards.map((h, i) => `
  <div class="hazard-row">
    <div class="flex items-start justify-between gap-2 mb-2">
      <div class="text-sm font-semibold text-slate-900">序号 ${i + 1}</div>
      <span class="shrink-0 text-[11px] px-2 py-0.5 rounded-full border ${
        h.done
          ? (record.status === 'done' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-blue-50 text-blue-700 border-blue-200')
          : 'bg-amber-50 text-amber-700 border-amber-200'
      }">${h.status}</span>
    </div>
    <div class="text-xs text-slate-500 space-y-1.5">
      <div><span class="text-slate-400">隐患类型</span> · <span class="text-slate-800 font-medium">${h.hazardType}</span></div>
      <div><span class="text-slate-400">是否重大隐患</span> · <span class="text-slate-800 font-medium">${h.isMajor ? '是' : '否'}</span></div>
      <div class="text-slate-700 leading-relaxed pt-1">${h.description}</div>
    </div>
    <div class="mt-3 flex justify-end gap-2">
      <button type="button" class="btn px-3 py-2 rounded-xl bg-white border border-slate-200 text-xs font-semibold text-blue-600"
              onclick="navTo('安环检查_整改通知_hazard_form.html?record=${id}&hazard=${h.id}&mode=view')">查看</button>
      ${record.status === 'pending' && !h.done ? `
      <button type="button" class="btn px-3 py-2 rounded-xl bg-blue-600 text-white text-xs font-semibold"
              onclick="navTo('安环检查_整改通知_hazard_form.html?record=${id}&hazard=${h.id}&mode=edit')">整改</button>` : ''}
    </div>
  </div>
`).join('');

syncMobileLayout();
  </script>
</body>
</html>
