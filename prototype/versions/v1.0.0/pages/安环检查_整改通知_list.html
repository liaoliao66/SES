<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>整改通知</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="mobile-layout.css">
  <style>
    .mobile-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40; padding-top: 3rem;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px); border-bottom: 1px solid #e2e8f0;
    }
    .mobile-content {
      padding-top: var(--mobile-header-h, 11rem); padding-bottom: 1.5rem;
      padding-left: 1rem; padding-right: 1rem;
    }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .btn { transition: transform 0.15s ease; }
    .btn:active { transform: scale(0.97); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
  <header class="mobile-header px-4 pb-3">
    <div class="flex items-center justify-between">
      <button type="button" class="btn w-10 h-10 rounded-xl bg-white border border-slate-200"
              onclick="navBack('app_home.html')">
        <i class="fa-solid fa-angle-left text-slate-700"></i>
      </button>
      <div class="text-[15px] font-semibold text-slate-900">整改通知</div>
      <div class="w-10"></div>
    </div>
    <div class="mt-2 text-xs text-slate-500 leading-relaxed">异常检查提交后自动创建；整改责任人在审批中逐条整改</div>
    <div class="mt-3 flex items-center gap-2 overflow-x-auto hide-scrollbar" id="tabBar">
      <button type="button" class="tab-btn btn shrink-0 px-3 py-2 rounded-xl bg-slate-900 text-white text-xs font-semibold" data-tab="all">全部</button>
      <button type="button" class="tab-btn btn shrink-0 px-3 py-2 rounded-xl bg-white border border-slate-200 text-xs text-slate-700" data-tab="pending">待整改</button>
      <button type="button" class="tab-btn btn shrink-0 px-3 py-2 rounded-xl bg-white border border-slate-200 text-xs text-slate-700" data-tab="review">待复核</button>
      <button type="button" class="tab-btn btn shrink-0 px-3 py-2 rounded-xl bg-white border border-slate-200 text-xs text-slate-700" data-tab="done">已复核</button>
    </div>
  </header>

  <main class="mobile-content space-y-3" id="listRoot"></main>

  <script>
function qs(sel, root) { return (root || document).querySelector(sel); }
function qsa(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }
function toast(message) {
  const el = document.createElement('div');
  el.className = 'fixed left-1/2 -translate-x-1/2 bottom-24 z-[999] px-4 py-2 rounded-2xl text-sm font-medium text-white bg-slate-900/90';
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 250ms ease'; }, 1200);
  setTimeout(() => el.remove(), 1700);
}
function navTo(page) { window.location.href = page; }
function navBack(fallback) {
  if (history.length > 1) history.back();
  else if (fallback) navTo(fallback);
}
function syncMobileLayout() {
  const header = document.querySelector('.mobile-header');
  if (header) document.documentElement.style.setProperty('--mobile-header-h', header.offsetHeight + 'px');
}
document.addEventListener('DOMContentLoaded', syncMobileLayout);
window.addEventListener('resize', syncMobileLayout);
  </script>
  <script>
    const DATA = [
      {
        id: 1,
        checkNo: '202610190071',
        title: '周度检查计划（设备维保项目部）',
        deadline: '2026-10-26',
        owner: '翁庆洋',
        hazards: 2,
        riskLevel: 'IV级(低风险)',
        status: 'pending',
        statusLabel: '待整改',
        badge: 'bg-amber-50 text-amber-700 border-amber-200'
      },
      {
        id: 2,
        checkNo: '202610120045',
        title: '日常巡检（码头作业区）',
        deadline: '2026-10-18',
        owner: '李明',
        hazards: 1,
        riskLevel: 'III级(一般风险)',
        status: 'review',
        statusLabel: '待复核',
        badge: 'bg-blue-50 text-blue-700 border-blue-200'
      },
      {
        id: 3,
        checkNo: '202610050018',
        title: '综合检查（生产一车间）',
        deadline: '2026-10-12',
        owner: '赵工',
        hazards: 1,
        riskLevel: 'IV级(低风险)',
        status: 'done',
        statusLabel: '已复核',
        badge: 'bg-emerald-50 text-emerald-700 border-emerald-200'
      }
    ];

    function renderList(tab) {
      const list = tab === 'all' ? DATA : DATA.filter(d => d.status === tab);
      qs('#listRoot').innerHTML = list.length ? list.map(item => `
        <div class="rounded-2xl bg-white border border-slate-200 p-4">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="text-sm font-semibold text-slate-900">${item.title}</div>
              <div class="text-xs text-slate-500 mt-1">编号 ${item.checkNo}</div>
            </div>
            <span class="shrink-0 px-2.5 py-1 rounded-full text-[11px] font-semibold border ${item.badge}">${item.statusLabel}</span>
          </div>
          <div class="mt-3 grid grid-cols-2 gap-2 text-xs text-slate-600">
            <div class="rounded-xl bg-slate-50 border border-slate-100 p-2.5">
              <div class="text-slate-400 mb-0.5">整改责任人</div>
              <div class="font-medium text-slate-800">${item.owner}</div>
            </div>
            <div class="rounded-xl bg-slate-50 border border-slate-100 p-2.5">
              <div class="text-slate-400 mb-0.5">整改截止</div>
              <div class="font-medium text-slate-800">${item.deadline}</div>
            </div>
            <div class="rounded-xl bg-slate-50 border border-slate-100 p-2.5 col-span-2">
              <div class="text-slate-400 mb-0.5">风险等级 · 隐患</div>
              <div class="font-medium text-slate-800">${item.riskLevel} · ${item.hazards} 条</div>
            </div>
          </div>
          <div class="mt-4 flex justify-end gap-2">
            <button type="button" class="btn px-3 py-2 rounded-xl bg-white border border-slate-200 text-xs font-semibold text-blue-600"
                    onclick="navTo('安环检查_整改通知_detail.html?id=${item.id}')">查看</button>
            ${item.status === 'pending' ? `
            <button type="button" class="btn px-3 py-2 rounded-xl bg-blue-600 text-white text-xs font-semibold"
                    onclick="navTo('安环检查_整改通知_detail.html?id=${item.id}')">整改</button>` : ''}
          </div>
        </div>
      `).join('') : `<div class="text-center text-sm text-slate-500 py-12">暂无数据</div>`;
      syncMobileLayout();
    }

    qsa('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        qsa('.tab-btn').forEach(b => {
          const active = b === btn;
          b.className = 'tab-btn btn shrink-0 px-3 py-2 rounded-xl text-xs font-semibold ' +
            (active ? 'bg-slate-900 text-white' : 'bg-white border border-slate-200 text-slate-700');
        });
        renderList(btn.dataset.tab);
      });
    });

    renderList('all');
  </script>
</body>
</html>
