<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>查看隐患整改</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="mobile-layout.css">
  <style>
    .mobile-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 40; padding-top: 3rem;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px); border-bottom: 1px solid #e2e8f0;
    }
    .mobile-content {
      padding-top: var(--mobile-header-h, 7rem); padding-bottom: 1.5rem;
      padding-left: 1rem; padding-right: 1rem;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .btn { transition: transform 0.15s ease; }
    .btn:active { transform: scale(0.97); }
    .sec-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 15px; font-weight: 650; color: #0f172a;
    }
    .sec-title::before {
      content: ""; width: 3px; height: 14px; border-radius: 2px; background: #3b82f6;
    }
    .form-row {
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid #f1f5f9; gap: 16px;
    }
    .form-row:last-child { border-bottom: none; }
    .form-row-label { font-size: 13px; color: #64748b; flex-shrink: 0; min-width: 72px; }
    .form-row-value { font-size: 13px; color: #0f172a; text-align: right; flex: 1; word-break: break-all; line-height: 1.45; }
    .form-label { font-size: 13px; color: #64748b; margin-bottom: 8px; }
    .form-label .req { color: #ef4444; margin-right: 2px; }
    .radio-row { display: flex; align-items: center; gap: 16px; pointer-events: none; }
    .radio-item { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #334155; }
    .radio-item input { accent-color: #3b82f6; width: 15px; height: 15px; }
    .upload-box {
      width: 88px; height: 88px; border: 1px dashed #cbd5e1; border-radius: 8px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; background: #fafafa; cursor: pointer;
    }
    .upload-box i { font-size: 20px; color: #94a3b8; }
    .upload-box span { font-size: 11px; color: #64748b; }
    .upload-box.has-img { border-style: solid; padding: 0; overflow: hidden; }
    .upload-box.has-img img { width: 100%; height: 100%; object-fit: cover; }
    .photo-thumb {
      width: 88px; height: 88px; border-radius: 8px; object-fit: cover;
      border: 1px solid #e2e8f0;
    }
    .field-ctrl {
      width: 100%; border: 1px solid #e2e8f0; background: #fff;
      border-radius: 10px; padding: 10px 12px; font-size: 14px; color: #0f172a;
      outline: none; resize: none;
    }
    .field-ctrl:focus { border-color: #93c5fd; }
    .field-ctrl:disabled { background: #f8fafc; color: #64748b; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased">
  <header class="mobile-header px-4 pb-3">
    <div class="flex items-center justify-between">
      <button type="button" class="btn w-10 h-10 rounded-xl bg-white border border-slate-200"
              onclick="closeForm()">
        <i class="fa-solid fa-angle-left text-slate-700"></i>
      </button>
      <div class="text-[15px] font-semibold text-slate-900" id="pageTitle">查看隐患整改</div>
      <button type="button" class="btn w-10 h-10 rounded-xl text-slate-500" onclick="closeForm()">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
    </div>
  </header>

  <main class="mobile-content space-y-3" style="padding-bottom: 6.5rem;">
    <!-- 隐患问题（只读） -->
    <section class="rounded-2xl bg-white border border-slate-200 overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-100">
        <div class="sec-title">隐患问题</div>
      </div>
      <div class="px-4">
        <div class="form-row">
          <span class="form-row-label">隐患类型</span>
          <span class="form-row-value" id="hazardType">—</span>
        </div>
        <div class="form-row" style="align-items:center;">
          <span class="form-row-label">重大隐患</span>
          <div class="radio-row" id="majorRadios">
            <label class="radio-item"><input type="radio" name="major" id="majorYes" disabled /> 是</label>
            <label class="radio-item"><input type="radio" name="major" id="majorNo" disabled /> 否</label>
          </div>
        </div>
        <div class="form-row">
          <span class="form-row-label">整改要求</span>
          <span class="form-row-value" id="hazardReq">—</span>
        </div>
        <div class="py-3 border-b border-slate-100">
          <div class="form-row-label mb-2">问题照片</div>
          <div class="flex gap-2 flex-wrap" id="problemPhotos"></div>
        </div>
        <div class="py-3">
          <div class="form-row-label mb-2">附件</div>
          <div id="problemAttachments" class="text-sm text-slate-600">—</div>
        </div>
      </div>
    </section>

    <!-- 隐患整改 -->
    <section class="rounded-2xl bg-white border border-slate-200 overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-100">
        <div class="sec-title">隐患整改</div>
      </div>
      <div class="px-4 py-4 space-y-5">
        <div>
          <div class="form-label"><span class="req">*</span>整改说明</div>
          <div class="relative">
            <textarea id="rectifyNote" maxlength="300" class="field-ctrl" rows="5" placeholder="请输入"></textarea>
            <div class="absolute bottom-2 right-3 text-xs text-slate-400" id="charCount">0 / 300</div>
          </div>
        </div>
        <div>
          <div class="form-label"><span class="req">*</span>整改照片</div>
          <div class="flex gap-3 flex-wrap items-start">
            <button type="button" class="upload-box" id="btnUploadImg" onclick="mockUploadPhoto()">
              <i class="fa-solid fa-cloud-arrow-up"></i>
              <span>上传图片</span>
            </button>
            <div id="rectifyPhotoPreview" class="hidden upload-box has-img">
              <img id="rectifyPhotoImg" src="" alt="整改照片">
            </div>
          </div>
        </div>
        <div>
          <div class="form-label">附件</div>
          <button type="button" id="btnUploadFile"
                  class="btn inline-flex items-center gap-2 px-4 py-2.5 rounded-xl border border-dashed border-slate-300 bg-slate-50 text-sm text-slate-600"
                  onclick="toast('原型演示：上传附件')">
            <i class="fa-solid fa-cloud-arrow-up text-slate-400"></i>
            上传文件
          </button>
          <p class="mt-2 text-[11px] text-slate-400 leading-relaxed">
            支持文件格式：.rar .zip .doc .docx .pdf，单个文件不能超过500MB
          </p>
          <div id="rectifyFileList" class="mt-2 space-y-1 text-xs text-slate-600"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="fixed bottom-0 left-0 right-0 z-40 px-4 pb-5 pt-3 bg-gradient-to-t from-slate-50 via-slate-50 to-transparent" id="footerBar">
    <div class="flex gap-3">
      <button type="button" class="btn flex-1 py-3 rounded-xl bg-white border border-slate-200 text-sm font-semibold text-slate-700"
              onclick="closeForm()">
        <i class="fa-solid fa-xmark mr-1 text-slate-400"></i>取消
      </button>
      <button type="button" id="btnConfirm" class="btn flex-1 py-3 rounded-xl bg-blue-600 text-white text-sm font-semibold shadow-lg shadow-blue-600/20"
              onclick="submitRectify()">
        <i class="fa-solid fa-check mr-1"></i>确定
      </button>
    </div>
  </div>

  <script>
function qs(sel, root) { return (root || document).querySelector(sel); }
function toast(message) {
  const el = document.createElement('div');
  el.className = 'fixed left-1/2 -translate-x-1/2 bottom-28 z-[999] px-4 py-2 rounded-2xl text-sm font-medium text-white bg-slate-900/90';
  el.textContent = message;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 250ms ease'; }, 1200);
  setTimeout(() => el.remove(), 1700);
}
function navTo(page) { window.location.href = page; }
function syncMobileLayout() {
  const header = document.querySelector('.mobile-header');
  if (header) document.documentElement.style.setProperty('--mobile-header-h', header.offsetHeight + 'px');
}
document.addEventListener('DOMContentLoaded', syncMobileLayout);
window.addEventListener('resize', syncMobileLayout);
  </script>
  <script>
const RECTIFY_RECORDS = {
  '1': {
    hazards: [
      {
        id: 'h1',
        hazardType: '临时用电',
        isMajor: false,
        description: '4#泊位电缆线需套管或从走桥架，规范布线',
        requirement: '立即整改',
        problemPhotos: ['https://images.unsplash.com/photo-1581092160562-40aa08e78837?auto=format&fit=crop&w=400&h=300&q=80'],
        attachments: [],
        done: false
      },
      {
        id: 'h2',
        hazardType: '围挡防护',
        isMajor: false,
        description: '1#泊位装船机新安装垫板涂刷油漆，移动脚手架搭设不规范',
        requirement: '立即整改',
        problemPhotos: ['https://images.unsplash.com/photo-1504328345606-18bbc8c9d7d1?auto=format&fit=crop&w=400&h=300&q=80'],
        attachments: [],
        done: false
      }
    ]
  },
  '2': {
    hazards: [
      {
        id: 'h3',
        hazardType: '消防器材',
        isMajor: true,
        description: '码头区 3 号仓库灭火器已超过检验有效期',
        requirement: '更换过期器材并更新消防台账',
        problemPhotos: ['https://images.unsplash.com/photo-1581092160562-40aa08e78837?auto=format&fit=crop&w=400&h=300&q=80'],
        attachments: ['器材清单.xlsx'],
        done: true,
        rectifyNote: '已更换 2 具灭火器，台账已更新。'
      }
    ]
  },
  '3': {
    hazards: [
      {
        id: 'h4',
        hazardType: '安全标识',
        isMajor: false,
        description: '车间入口及作业区域缺少安全警示标识',
        requirement: '补齐标识牌',
        problemPhotos: [],
        attachments: [],
        done: true,
        rectifyNote: '已补齐 3 处标识。'
      }
    ]
  }
};

const params = new URLSearchParams(location.search);
const recordId = params.get('record') || '1';
const hazardId = params.get('hazard') || 'h1';
const mode = params.get('mode') || 'edit';
const isView = mode === 'view';

const record = RECTIFY_RECORDS[recordId] || RECTIFY_RECORDS['1'];
const hazard = record.hazards.find(h => h.id === hazardId) || record.hazards[0];

let hasRectifyPhoto = false;

qs('#pageTitle').textContent = isView ? '查看隐患整改' : '隐患整改';
qs('#hazardType').textContent = hazard.hazardType || '—';
qs('#majorYes').checked = !!hazard.isMajor;
qs('#majorNo').checked = !hazard.isMajor;
qs('#hazardReq').textContent = hazard.requirement || '—';

const photosEl = qs('#problemPhotos');
if (hazard.problemPhotos && hazard.problemPhotos.length) {
  photosEl.innerHTML = hazard.problemPhotos.map(url =>
    `<img class="photo-thumb" src="${url}" alt="问题照片">`
  ).join('');
} else {
  photosEl.innerHTML = '<span class="text-sm text-slate-400">暂无</span>';
}

const attachEl = qs('#problemAttachments');
if (hazard.attachments && hazard.attachments.length) {
  attachEl.innerHTML = hazard.attachments.map(f =>
    `<div class="flex items-center gap-2 py-1"><i class="fa-regular fa-file text-slate-400"></i>${f}</div>`
  ).join('');
} else {
  attachEl.innerHTML = '<span class="text-slate-400">暂无</span>';
}

const noteEl = qs('#rectifyNote');
const savedNote = sessionStorage.getItem(`rectify_note_${recordId}_${hazardId}`);
if (savedNote) noteEl.value = savedNote;
else if (hazard.rectifyNote) noteEl.value = hazard.rectifyNote;

if (sessionStorage.getItem(`rectify_photo_${recordId}_${hazardId}`)) {
  showRectifyPhoto(sessionStorage.getItem(`rectify_photo_${recordId}_${hazardId}`));
}

function updateCharCount() {
  qs('#charCount').textContent = noteEl.value.length + ' / 300';
}
noteEl.addEventListener('input', updateCharCount);
updateCharCount();

if (isView) {
  noteEl.disabled = true;
  noteEl.placeholder = noteEl.value ? '' : '暂无整改说明';
  qs('#btnUploadImg').classList.add('hidden');
  qs('#btnUploadFile').disabled = true;
  qs('#btnUploadFile').classList.add('opacity-50', 'pointer-events-none');
  qs('#footerBar').classList.add('hidden');
  document.querySelector('.mobile-content').style.paddingBottom = '1.5rem';
}

function mockUploadPhoto() {
  if (isView) return;
  const url = 'https://images.unsplash.com/photo-1581092160562-40aa08e78837?auto=format&fit=crop&w=200&h=200&q=80';
  showRectifyPhoto(url);
  toast('已上传整改照片（原型）');
}

function showRectifyPhoto(url) {
  hasRectifyPhoto = true;
  qs('#rectifyPhotoImg').src = url;
  qs('#rectifyPhotoPreview').classList.remove('hidden');
  sessionStorage.setItem(`rectify_photo_${recordId}_${hazardId}`, url);
}

function closeForm() {
  if (history.length > 1) history.back();
  else navTo(`安环检查_整改通知_detail.html?id=${recordId}`);
}

function submitRectify() {
  if (isView) { closeForm(); return; }
  const note = noteEl.value.trim();
  if (!note) { toast('请填写整改说明'); noteEl.focus(); return; }
  if (!hasRectifyPhoto) { toast('请上传整改照片'); return; }
  const key = 'rectify_' + recordId;
  const doneIds = JSON.parse(sessionStorage.getItem(key) || '[]');
  if (!doneIds.includes(hazardId)) doneIds.push(hazardId);
  sessionStorage.setItem(key, JSON.stringify(doneIds));
  sessionStorage.setItem(`rectify_note_${recordId}_${hazardId}`, note);
  toast('整改信息已保存');
  setTimeout(closeForm, 500);
}

syncMobileLayout();
  </script>
</body>
</html>
